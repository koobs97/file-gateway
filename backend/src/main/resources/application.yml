spring:
  application:
    name: file-gateway
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  storage:
    base-path: ${STORAGE_PATH:./uploads}
    max-file-size: 104857600
    allowed-extensions: docx,xlsx,pptx
