# =====================================================================
# 인프라 서비스 (항상 실행)
# - postgres : 데이터베이스
# - nginx    : 리버스 프록시 (Blue-Green 업스트림 전환 지원)
#
# 실행: docker-compose -f docker/docker-compose.infra.yml --env-file docker/.env.prod up -d
# =====================================================================

services:

  # ── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: file-gateway-postgres
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - file-gateway-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx 리버스 프록시 ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: file-gateway-nginx
    ports:
      - "80:80"
    volumes:
      # nginx.conf: 메인 설정 (읽기 전용)
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # conf.d: upstream.conf 동적 수정 가능 (쓰기 허용)
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - file-gateway-net
    restart: unless-stopped
    depends_on:
      - postgres

networks:
  file-gateway-net:
    name: file-gateway-net
    driver: bridge

volumes:
  postgres_data:
