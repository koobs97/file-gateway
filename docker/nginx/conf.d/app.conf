# =====================================================================
# 라우팅 설정
#
# $backend_host, $frontend_host 변수는 upstream.conf(map 지시어)에서 정의됨
# nginx.conf의 include /etc/nginx/conf.d/*.conf 로 http 블록 레벨에서 자동 로드
#
# resolver 127.0.0.11: Docker 내장 DNS
#   proxy_pass에 변수($var)를 사용하면 시작 시 resolve하지 않고
#   요청 시점에 resolver로 동적 resolve → 컨테이너 미존재 시에도 nginx 기동 가능
# =====================================================================

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen       80;
    server_name  localhost;

    # ── 백엔드 REST API ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://$backend_host:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket (실시간 CDR 상태 알림) ────────────────────────────
    location /ws/ {
        proxy_pass             http://$backend_host:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    # ── Swagger UI ───────────────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
    }

    location /v3/ {
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
    }

    # ── 프론트엔드 (Vue 3 SPA) ───────────────────────────────────────
    location / {
        proxy_pass         http://$frontend_host:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
