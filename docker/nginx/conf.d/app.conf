# =====================================================================
# 라우팅 설정
#
# upstream.conf 에서 정의한 변수를 server 블록 내에서 사용:
#   $backend_host  → blue/green 슬롯 컨테이너명 (배포 시 전환)
#   $frontend_host → 프론트엔드 컨테이너명
#
# resolver 127.0.0.11: Docker 내장 DNS → 요청 시점에 동적 resolve
#   upstream 블록을 쓰지 않으므로 nginx 시작 시 DNS resolve 실패 없음
# =====================================================================

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen       80;
    server_name  localhost;

    # upstream 변수 로드 (server 블록 내 include → set 지시어 유효)
    include /etc/nginx/conf.d/upstream.conf;

    # ── 백엔드 REST API ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://$backend_host:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket (실시간 CDR 상태 알림) ────────────────────────────
    location /ws/ {
        proxy_pass             http://$backend_host:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    # ── Swagger UI ───────────────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
    }

    location /v3/ {
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
    }

    # ── 프론트엔드 (Vue 3 SPA) ───────────────────────────────────────
    location / {
        proxy_pass         http://$frontend_host:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
