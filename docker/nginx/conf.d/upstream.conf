# Blue-Green upstream 변수 (deploy.sh가 docker cp로 자동 갱신)
# 현재 활성: blue
#
# map 지시어: http 블록 레벨에서 사용 가능
#   - set 지시어는 server/location 내부 전용이므로 conf.d/*.conf glob include 시 에러 발생
#   - map은 http 블록 레벨에서 변수를 정의하므로 nginx.conf 자동 include와 호환됨
#   - app.conf에서 별도 include 불필요 (nginx.conf의 *.conf glob이 처리)
map "" $backend_host {
    default "file-gateway-blue";
}
map "" $frontend_host {
    default "file-gateway-frontend";
}
